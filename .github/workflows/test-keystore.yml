name: Test Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-24.04
    env:
      BUILD_ABI: arm64-v8a
      SIGN_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
      SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGN_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Check signing secrets
        run: |
          test -n "$SIGN_KEY_BASE64"
          test -n "$SIGN_KEY_ALIAS"
          test -n "$SIGN_KEY_PWD"

      - name: Decode keystore
        run: |
          printf '%s' "$SIGN_KEY_BASE64" | base64 --decode > signing.keystore
          test -s signing.keystore

      - name: Inspect keystore alias
        run: |
          keytool -list \
            -keystore signing.keystore \
            -storepass "$SIGN_KEY_PWD" \
            -alias "$SIGN_KEY_ALIAS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PsignKeyFile="$PWD/signing.keystore" \
            -PsignKeyAlias="$SIGN_KEY_ALIAS" \
            -PsignKeyPwd="$SIGN_KEY_PWD"

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -name "*.apk" -print -exec ls -lh {} \;

      - name: Verify APK signature
        run: |
          while IFS= read -r apk; do
            echo "Verifying $apk"
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify \
              --verbose \
              --print-certs \
              "$apk"
          done < <(find app/build/outputs/apk -path "*/release/*.apk" -print)

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
